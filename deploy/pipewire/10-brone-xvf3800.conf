# BRONE: mic reSpeaker XVF3800 (5 Okt 2026), menggantikan rantai lama
# WebRTC AEC (pipewire-pulse.conf.d/20-brone-aec.conf) + RNNoise
# (10-brone-rnnoise.conf), keduanya kini *.disabled_20261005.
#
# Firmware USB XVF3800 mengeluarkan 6 channel @16 kHz:
#   ch0 (FL)  = output olahan chip: beamforming + AEC + noise suppression + AGC
#   ch1 (FR)  = output olahan kedua (gain lebih kecil, NS lebih ringan)
#   ch2..ch5  = 4 mic mentah
# Diukur 5 Okt 2026 di ruangan NUC: noise floor ch0 ~0.005 vs ~0.012 (ch1)
# dan ~0.008-0.010 (mic mentah), sinyal keras ~2x lebih tinggi -> ch0 dipakai.
#
# Speaker = USB "Generic CS202" (default sink); jack 3.5mm reSpeaker kosong
# (diuji chirp 5 Okt 2026). Akibatnya AEC on-chip TIDAK membatalkan suara robot
# (referensinya hanya playback USB reSpeaker). Aman untuk loop half-duplex
# sekarang; untuk barge-in, pindahkan speaker ke jack reSpeaker.
# Jangan tumpuk WebRTC AEC/RNNoise lagi di atasnya: double-NS merusak STT.
#
# Nama node sumber tergantung profil kartu "output:analog-stereo+input:analog-surround-51"
# (tersimpan di ~/.local/state/wireplumber/default-profile). Kalau profil
# diganti, sesuaikan target.object di bawah. 12 Okt 2026: profil sudah 51
# (6 channel, posisi FL,FR,RL,RR,FC,LFE = ch0..ch5); profil 21 lama hanya
# membuka 3 channel sehingga mic mentah ch3..ch5 tidak ada.
context.modules = [
    { name = libpipewire-module-loopback
        flags = [ nofail ]
        args = {
            node.description = "BRONE Mic (XVF3800 ch0)"
            media.name       = "BRONE Mic (XVF3800 ch0)"
            capture.props = {
                node.name         = "brone-xvf-capture"
                audio.position    = [ FL ]
                stream.dont-remix = true
                target.object     = "alsa_input.usb-Seeed_Studio_reSpeaker_XVF3800_4-Mic_Array_<SERIAL-XVF3800>-00.analog-surround-51"
                node.passive      = true
            }
            playback.props = {
                node.name        = "brone-mic-xvf"
                node.description = "BRONE Mic (XVF3800 ch0)"
                media.class      = Audio/Source
                audio.position   = [ MONO ]
            }
        }
    }
    # 4 mic mentah (ch2..ch5) untuk audio_gaze (GCC-PHAT/DoA), urutan channel
    # dipertahankan: brone-mic-raw4 ch0..ch3 = XVF ch2..ch5. Posisi keluaran
    # FL,FR,RL,RR = peta 4 channel standar ALSA, jadi klien ALSA/sounddevice
    # 4 channel tersambung 1:1 tanpa remix. Mic mentah SENGAJA tidak diberi
    # RNNoise per channel: gain yang berbeda tiap channel merusak selisih
    # waktu antar-mic; peredaman derau untuk DoA ada di audio_gaze (dsp/noise.py).
    { name = libpipewire-module-loopback
        flags = [ nofail ]
        args = {
            node.description = "BRONE Mic Raw (XVF3800 ch2-5)"
            media.name       = "BRONE Mic Raw (XVF3800 ch2-5)"
            capture.props = {
                node.name         = "brone-xvf-raw-capture"
                audio.position    = [ RL RR FC LFE ]
                stream.dont-remix = true
                target.object     = "alsa_input.usb-Seeed_Studio_reSpeaker_XVF3800_4-Mic_Array_<SERIAL-XVF3800>-00.analog-surround-51"
                node.passive      = true
            }
            playback.props = {
                node.name        = "brone-mic-raw4"
                node.description = "BRONE Mic Raw (XVF3800 ch2-5)"
                media.class      = Audio/Source
                audio.position   = [ FL FR RL RR ]
            }
        }
    }
]
