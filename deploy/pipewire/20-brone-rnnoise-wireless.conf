# BRONE: mic wireless (Jieli) + RNNoise -> brone-mic-wireless (12 Okt 2026).
#
# Mic wireless tidak punya noise suppression on-chip seperti XVF3800, jadi
# RNNoise dipasang di sini. Sengaja HANYA untuk mic wireless: XVF3800 ch0
# (brone-mic-xvf) sudah diredam chip, dan RNNoise di atasnya = double-NS yang
# merusak STT (lihat 10-brone-xvf3800.conf).
#
# brone_talk.py memilih node ini otomatis kalau kartu "Wireless microphone"
# ada di /proc/asound/cards dan XVF3800 tidak (BRONE_INPUT_PIPEWIRE_NODES di
# brone-talk.service). Kalau mic wireless dicabut, capture di bawah jatuh ke
# default source, tapi brone-talk tidak membaca node ini selama itu.
#
# RNNoise hanya meredam derau non-ucapan (kipas, AC, dengung); suara orang
# lain tetap lolos. VAD Threshold 30% = nilai rantai lama (Sep 2026).
# target.object memuat serial receiver; ganti kalau receiver-nya diganti.
context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "BRONE Mic (wireless + RNNoise)"
            media.name       = "BRONE Mic (wireless + RNNoise)"
            filter.graph = {
                nodes = [
                    {
                        type    = ladspa
                        name    = rnnoise
                        plugin  = "<HOME>/.local/lib/ladspa/librnnoise_ladspa.so"
                        label   = noise_suppressor_mono
                        control = { "VAD Threshold (%)" 30.0 }
                    }
                ]
            }
            audio.channels = 1
            audio.position = [ MONO ]
            capture.props = {
                node.name     = "effect_input.rnnoise-wireless"
                target.object = "alsa_input.usb-Jieli_Technology_Wireless_microphone_<SERIAL-RECEIVER-WIRELESS>-00.mono-fallback"
                node.passive  = true
            }
            playback.props = {
                node.name        = "brone-mic-wireless"
                node.description = "BRONE Mic (wireless + RNNoise)"
                media.class      = Audio/Source
            }
        }
    }
]
